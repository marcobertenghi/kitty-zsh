# Shared macOS/Linux terminal setup. Zsh itself stays portable to other terminals.
font_family JetBrainsMono Nerd Font
font_size 12.0
background_opacity 0.95
window_padding_width 6
scrollback_lines 10000
enable_audio_bell no

# Ready to use without changing the account's login shell.
shell zsh -l

# Manual integration in .zshrc supports reload and nested Zsh sessions.
shell_integration disabled

# Dark fallback; Kitty 0.38+ selects the installed automatic theme files.
include dark-theme.auto.conf

# Native splits and tabs: no multiplexer dependency.
enabled_layouts splits,stack,tall
tab_bar_style powerline
map ctrl+shift+enter launch --cwd=current
map ctrl+alt+enter launch --location=vsplit --cwd=current
map ctrl+alt+shift+enter launch --location=hsplit --cwd=current
map ctrl+shift+t new_tab_with_cwd

# Optional private overrides; a missing file is fine. Never installed/overwritten.
globinclude kitty.local.conf
