# Shared macOS/Linux terminal setup. Zsh itself stays portable to other terminals.
font_family JetBrainsMono Nerd Font
font_size 14.0
background_opacity 0.95
window_padding_width 6
window_border_width 1.0
draw_minimal_borders no
scrollback_lines 10000
enable_audio_bell no

# Ready to use without changing the account's login shell.
shell zsh -l

# Manual integration in .zshrc supports reload and nested Zsh sessions.
shell_integration disabled

# Moon fallback; all three automatic theme files also use Moon on Kitty 0.38+.
include dark-theme.auto.conf

# Native splits and tabs: no multiplexer dependency.
enabled_layouts splits,stack,tall,grid
tab_bar_style powerline
tab_powerline_style round
tab_title_template "{index}: {title}"
active_tab_font_style bold
map ctrl+shift+enter launch --cwd=current
# Explicit splits work even after switching to stack, tall or grid.
map ctrl+alt+enter combine : goto_layout splits : launch --location=vsplit --cwd=current
map ctrl+alt+shift+enter combine : goto_layout splits : launch --location=hsplit --cwd=current
map ctrl+shift+t new_tab_with_cwd

# Focus and rearrange panes without interfering with shell word movement.
map ctrl+alt+left neighboring_window left
map ctrl+alt+right neighboring_window right
map ctrl+alt+up neighboring_window up
map ctrl+alt+down neighboring_window down
map ctrl+alt+shift+left move_window left
map ctrl+alt+shift+right move_window right
map ctrl+alt+shift+up move_window up
map ctrl+alt+shift+down move_window down
map ctrl+shift+z toggle_layout stack
map ctrl+alt+r resize_window reset
# Kitty defaults: Ctrl-Shift-R resizes; Ctrl-Shift-F7 selects a visible pane.

# Numbered tabs complement Kitty's Ctrl-Shift-[1-9] pane selection.
map ctrl+alt+1 goto_tab 1
map ctrl+alt+2 goto_tab 2
map ctrl+alt+3 goto_tab 3
map ctrl+alt+4 goto_tab 4
map ctrl+alt+5 goto_tab 5
map ctrl+alt+6 goto_tab 6
map ctrl+alt+7 goto_tab 7
map ctrl+alt+8 goto_tab 8
map ctrl+alt+9 goto_tab 9

# Optional private overrides; a missing file is fine. Never installed/overwritten.
globinclude kitty.local.conf
