# Shared macOS/Linux terminal setup. Zsh itself stays portable to other terminals.
font_family JetBrainsMono Nerd Font
font_size 18.0
background_opacity 0.95
# Frameless OS window. Restart Kitty after changing decorations.
hide_window_decorations yes
# More breathing room between split contents; keep the single-pane inset compact.
window_padding_width 12
single_window_padding_width 8
# Anchor cell-grid remainders at the bottom/right rather than centering each pane.
placement_strategy top-left
# Full outlines with a fixed gap; absorb cell-grid remainders inside the border.
watcher aligned_borders.py
window_margin_width 4
single_window_margin_width 0
window_border_width 1.0
draw_minimal_borders no
scrollback_lines 10000
enable_audio_bell no

# Copy highlighted text to the system clipboard instead of extending selection.
# Paste with Ctrl-Shift-V in Kitty, or the normal paste shortcut in other apps.
mouse_map right press ungrabbed copy_to_clipboard

# OSC 8 links from eza listings; Ctrl-Shift-left-click opens the link.
allow_hyperlinks yes

# Native cursor animation (Kitty 0.37+); inherits Moon's gold cursor colour.
# Skip tiny movements and keep the trail short so normal typing stays calm.
cursor_trail 3
cursor_trail_decay 0.1 0.25
cursor_trail_start_threshold 2

# Ready to use without changing the account's login shell.
shell zsh -l

# Manual integration in .zshrc supports reload and nested Zsh sessions.
shell_integration disabled

# Moon fallback; all three automatic theme files also use Moon on Kitty 0.38+.
include dark-theme.auto.conf

# Tall: one main pane on the left (60%), with other panes stacked on the right.
enabled_layouts tall:bias=60;full_size=1,splits,stack,grid
tab_bar_style powerline
tab_powerline_style round
tab_title_template "{index}: {title}"
active_tab_font_style bold
# One shortcut adds panes in Tall, even when returning from a zoomed Stack view.
# Append to the right column regardless of which pane currently has focus.
map ctrl+shift+enter combine : goto_layout tall : launch --location=last --cwd=current
# Explicit splits work even after switching to stack, tall or grid.
map ctrl+alt+enter combine : goto_layout splits : launch --location=vsplit --cwd=current
map ctrl+alt+shift+enter combine : goto_layout splits : launch --location=hsplit --cwd=current
map ctrl+shift+t new_tab_with_cwd

# Focus and rearrange panes. Free these shortcuts in Xfce: docs/kali-desktop.md.
map ctrl+alt+left neighboring_window left
map ctrl+alt+right neighboring_window right
map ctrl+alt+up neighboring_window up
map ctrl+alt+down neighboring_window down
map ctrl+alt+shift+left move_window left
map ctrl+alt+shift+right move_window right
map ctrl+alt+shift+up move_window up
map ctrl+alt+shift+down move_window down
map ctrl+shift+z toggle_layout stack
map ctrl+alt+r resize_window reset
# Kitty defaults: Ctrl-Shift-R resizes; Ctrl-Shift-F7 selects a visible pane.

# Numbered tabs complement Kitty's Ctrl-Shift-[1-9] pane selection.
map ctrl+alt+1 goto_tab 1
map ctrl+alt+2 goto_tab 2
map ctrl+alt+3 goto_tab 3
map ctrl+alt+4 goto_tab 4
map ctrl+alt+5 goto_tab 5
map ctrl+alt+6 goto_tab 6
map ctrl+alt+7 goto_tab 7
map ctrl+alt+8 goto_tab 8
map ctrl+alt+9 goto_tab 9

# Optional private overrides; a missing file is fine. Never installed/overwritten.
globinclude kitty.local.conf
